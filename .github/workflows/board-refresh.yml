name: refresh-board
on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if board content is unchanged (ships latest code with the robot's data)"
        type: boolean
        default: false
  schedule:
    # user-tuned 2026-06-12 (no-overage edition): hourly 7am-noon ET,
    # half-hourly 12:30-8pm ET (the lineup flood), hourly 9-11pm ET
    # :07/:37 instead of :00/:30 - GitHub drops jobs on congested round minutes
    - cron: "7 11-23 * * *"   # ~hourly, 7:07am-7:07pm ET
    - cron: "7 0-3 * * *"     # ~hourly, 8:07pm-11:07pm ET
    - cron: "37 16-23 * * *"  # half-hours, 12:37-7:37pm ET
concurrency:
  group: refresh-board
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore engine + board state
        uses: actions/cache@v4
        with:
          # .cache = stats scratchpad; web/public/data = the prior board the
          # freeze-merge reads (CI runners are stateless - without this,
          # started games would drop and every run would deploy)
          path: |
            .cache
            web/public/data
          key: engine-cache-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Compute board
        id: job
        run: python -m model.jobs refresh
      - name: Publish to Vercel
        if: steps.job.outputs.changed == 'true' || inputs.force_deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --cwd web --token ${{ secrets.VERCEL_TOKEN }} --yes
