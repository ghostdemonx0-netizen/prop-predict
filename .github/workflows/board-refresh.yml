name: refresh-board
on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if board content is unchanged (ships latest code with the robot's data)"
        type: boolean
        default: false
concurrency:
  group: refresh-board
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Use latest main HEAD (avoid stale trigger-SHA deploy races)
        # workflow_dispatch pins the checkout to main's SHA at trigger time. With a
        # ~10 min compute, a run triggered just before a code merge would deploy the
        # OLD code on top of a newer deploy (the bug that made fresh UI deploys
        # "not land"). Reset to the current main HEAD so the robot always ships the
        # latest code. Gitignored board state (restored from cache below) is not
        # touched by a git reset, so the freeze-merge is unaffected.
        run: |
          git fetch -q --depth=1 origin main
          git reset --hard FETCH_HEAD
          echo "deploying $(git rev-parse --short HEAD)"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore engine + board state
        uses: actions/cache@v5
        with:
          # .cache = stats scratchpad; web/public/data = the prior board the
          # freeze-merge reads (CI runners are stateless - without this,
          # started games would drop and every run would deploy)
          path: |
            .cache
            web/public/data
          key: engine-cache-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Compute board
        id: job
        env:
          # force_deploy means "ship latest code" — that requires a real
          # recompute, not just re-deploying the unchanged cached board.
          FORCE_RECOMPUTE: ${{ inputs.force_deploy }}
        run: python -m model.jobs refresh
      - name: Publish to Vercel
        if: steps.job.outputs.changed == 'true' || inputs.force_deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --cwd web --token ${{ secrets.VERCEL_TOKEN }} --yes
      - name: Publish board to data branch
        # Snapshots the fresh board JSON to the orphan-ish `board-data` branch so
        # local curating sessions can pull it fast (force-push = one tiny snapshot,
        # no history bloat). JSON only — never touches main.
        if: steps.job.outputs.changed == 'true' || inputs.force_deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp=$(mktemp -d)
          cp web/public/data/*.json "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          mkdir -p web/public/data && mv *.json web/public/data/ 2>/dev/null || true
          git init -q
          git config user.email "board-bot@users.noreply.github.com"
          git config user.name "board-bot"
          git add web/public/data
          git commit -q -m "board snapshot $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:board-data

  # Snapshot every just-frozen game's predictions into the private
  # predictions-archive branch. Runs AFTER refresh fully finishes (needs:),
  # so the board is already published + deployed — an archive hiccup can never
  # hold up the live site. Rides board-refresh's cron (one cadence dial).
  archive:
    needs: refresh
    uses: ./.github/workflows/archive-predictions.yml
    secrets: inherit
