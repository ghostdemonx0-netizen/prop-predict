name: morning-board
on:
  workflow_dispatch: {}
concurrency:
  group: refresh-board
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore engine + board state
        uses: actions/cache@v5
        with:
          # .cache = stats scratchpad; web/public/data = the prior board the
          # freeze-merge reads (CI runners are stateless - without this,
          # started games would drop and every run would deploy)
          path: |
            .cache
            web/public/data
          key: engine-cache-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Compute board
        id: job
        run: python -m model.jobs morning
      - name: Publish to Vercel
        if: steps.job.outputs.changed == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --cwd web --token ${{ secrets.VERCEL_TOKEN }} --yes
      - name: Publish board to data branch
        # Same as refresh: snapshot the fresh board to the `board-data` branch
        # for fast local pulls. JSON only — never touches main.
        if: steps.job.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp=$(mktemp -d)
          cp web/public/data/*.json "$tmp"/ 2>/dev/null || true
          cd "$tmp"
          mkdir -p web/public/data && mv *.json web/public/data/ 2>/dev/null || true
          git init -q
          git config user.email "board-bot@users.noreply.github.com"
          git config user.name "board-bot"
          git add web/public/data
          git commit -q -m "board snapshot $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:board-data
