name: curated-plays
on:
  # Fires ONLY when triggered (manual run, or a cron-job.org entry hitting the
  # workflow_dispatch API at the user's chosen send times). Deliberately NOT
  # chained to every board refresh — that would email ~48x/day.
  workflow_dispatch: {}
concurrency:
  group: curated-plays
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plays:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore board from the refresh build cache
        uses: actions/cache/restore@v5
        with:
          # the refresh workflow saves web/public/data under engine-cache-<run_id>;
          # restore-keys prefix grabs the newest published board (read-only here).
          path: |
            web/public/data
          key: board-readonly-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Curate + deliver plays
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PLAYS_TO_EMAIL: ${{ secrets.PLAYS_TO_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m model.plays_deliver
