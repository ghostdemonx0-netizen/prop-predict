name: refresh-board
on:
  workflow_dispatch: {}
  schedule:
    # user-tuned 2026-06-12 (no-overage edition): hourly 7am-noon ET,
    # half-hourly 12:30-8pm ET (the lineup flood), hourly 9-11pm ET
    - cron: "0 11-23 * * *"   # on the hour, 7am-7pm ET
    - cron: "0 0-3 * * *"     # on the hour, 8pm-11pm ET
    - cron: "30 16-23 * * *"  # half-hours, 12:30-7:30pm ET
concurrency:
  group: refresh-board
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore engine + board state
        uses: actions/cache@v4
        with:
          # .cache = stats scratchpad; web/public/data = the prior board the
          # freeze-merge reads (CI runners are stateless - without this,
          # started games would drop and every run would deploy)
          path: |
            .cache
            web/public/data
          key: engine-cache-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Compute board
        id: job
        run: python -m model.jobs refresh
      - name: Publish to Vercel
        if: steps.job.outputs.changed == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --cwd web --token ${{ secrets.VERCEL_TOKEN }} --yes
