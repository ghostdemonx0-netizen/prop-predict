name: deep-board
on:
  # Fires ONLY on trigger (manual run, or a cron-job.org entry hitting the
  # workflow_dispatch API at the user's chosen deep-report times).
  workflow_dispatch: {}
concurrency:
  group: deep-board
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore board from the refresh build cache
        uses: actions/cache/restore@v5
        with:
          # MUST match board-refresh's cache `path` EXACTLY (.cache + web/public/data),
          # or the cache version-hash won't match the engine-cache-* entries.
          path: |
            .cache
            web/public/data
          key: deep-board-readonly-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Build + deliver the deep board
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PLAYS_TO_EMAIL: ${{ secrets.PLAYS_TO_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m model.deep_deliver
