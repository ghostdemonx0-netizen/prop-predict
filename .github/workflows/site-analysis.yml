name: site-analysis
on:
  workflow_dispatch: {}
concurrency:
  group: site-analysis
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore board from the refresh build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache
            web/public/data
          key: site-analysis-readonly-${{ github.run_id }}
          restore-keys: engine-cache-
      - name: Build + deliver the full site board
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PLAYS_TO_EMAIL: ${{ secrets.PLAYS_TO_EMAIL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python -m model.site_deliver
